<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Tulan Staffing</title>
<style>
:root{--p:#5b2490;--bg:#f6f4f8;--card:#fff;--line:#e3dfe8;--muted:#716a78}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#21172d}
header{background:#fff;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:23px;margin:0 0 10px}.views,.days,.actions{display:flex;gap:7px;overflow:auto;flex-wrap:wrap}
button{font:inherit;min-height:42px}.pill,.btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-weight:750}
.pill.on,.primary{background:var(--p);color:#fff;border-color:var(--p)}main{max-width:850px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:0 0 6px}select,input{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid #d8d1df;border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:31px;font-weight:850;color:var(--p)}
.person{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.name{font-weight:800}.muted{font-size:13px;color:var(--muted)}
.btn{border-radius:11px}.primary{border-radius:11px;padding:10px 13px;font-weight:800}.week{overflow:auto}.week table{border-collapse:collapse;min-width:720px;width:100%}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cell{border:1px solid var(--line);border-radius:9px;padding:7px;min-height:70px;background:#fff}.cell b{display:block}.badge{font-size:11px;color:var(--p);font-weight:800}
.edit{border-top:1px solid var(--line);padding:12px 0}.edit:first-child{border-top:0}
@media(max-width:520px){.grid{grid-template-columns:1fr}.cal{gap:3px}.cell{padding:5px;min-height:58px;font-size:12px}}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.modalBack[hidden]{display:none}.modalBox{background:#fff;border-radius:22px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modalBox h2{margin:0 0 14px}.modalBox textarea{width:100%;min-height:90px;box-sizing:border-box}.modalBox select,.modalBox input,.modalBox textarea{font-size:16px}</style></head><body>
<header><h1>Tulan — Hourly Staffing</h1><div class="actions" style="margin-bottom:12px"><button class="primary" id="notesBtn">Staff Notes / Time Off</button></div><div id="absenceBanner"></div><div class="views" id="views"></div></header>
<main>
<div id="dayPanel">
 <div class="card"><div class="days" id="days"></div></div>
 <div class="card grid"><div><label>SHOW STAFF WORKING AT</label><select id="time"></select></div><div><label>EMPLOYEES WORKING</label><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px"><div id="count" class="big">0</div><div style="text-align:right"><div class="muted" id="dayLaborLabel">LABOR COST AT 2 PM</div><div id="dayLabor" class="big" style="font-size:24px">$0.00</div></div></div></div></div>
 <div class="card" id="staff"></div>
</div>
<div id="weekPanel" hidden><div class="card week" id="week"></div><div class="card grid"><div><label>CHANGE HOUR</label><select id="weekTime"></select></div></div></div>
<div id="monthPanel" hidden><div class="card"><div class="grid"><div><label>MONTH</label><input type="month" id="monthPick"></div><div><label>SELECTED DATE</label><div id="monthInfo" class="muted"></div></div></div></div><div class="card cal" id="calendar"></div></div>
<div class="card">
 <div class="actions"><button class="primary" id="add">+ Add employee</button><button class="btn" id="manageBtn">Modify employees</button><button class="btn" id="copy">Copy day to weekdays</button><button class="btn" id="clearDay">Clear this day</button><button class="btn" id="clearAll">Clear all schedules</button><button class="btn" id="importBtn">Import starter/backup</button><button class="btn" id="exportBtn">Export backup</button></div>
 <input type="file" id="file" accept=".json,application/json" hidden>
 <div id="managePanel" hidden>
   <div style="margin-top:14px"><b>Modify Employees</b><div class="muted">Edit name, position, and today's shift here.</div></div>
   <div id="editor"></div>
 </div>
</div>
<p class="muted">Schedules are saved in this browser on this device. The public GitHub app contains no employee names.</p>
<div id="noteModal" class="modalBack" hidden><div class="modalBox"><h2>Staff Notes / Time Off</h2><div class="grid"><div><label>EMPLOYEE</label><select id="noteEmployee"></select></div><div><label>TYPE</label><select id="noteType"><option>Sick leave</option><option>Vacation</option><option>Requested off</option><option>Other</option></select></div><div><label>START DATE</label><input id="noteStartDate" type="date"></div><div><label>END DATE</label><input id="noteEndDate" type="date"></div><div><label>ALL DAY?</label><select id="noteAllDay"><option value="yes">Yes</option><option value="no">No — specific hours</option></select></div><div><label>START TIME</label><input id="noteStartTime" type="time"></div><div><label>END TIME</label><input id="noteEndTime" type="time"></div><div><label>NOTE</label><textarea id="noteText" placeholder="Example: Doctor appointment"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="noteSave">Save note</button><button class="btn" id="noteCancel">Cancel</button></div><div id="noteList" style="margin-top:16px"></div></div></div><div id="employeeModal" class="modalBack" hidden><div class="modalBox"><h2>Edit Employee</h2><div class="grid"><div><label>NAME</label><input id="popName"></div><div><label>POSITION</label><input id="popRole"></div><div><label>DUTIES / DESCRIPTION</label><textarea id="popDuties" placeholder="Example: Prep vegetables, cook noodles, clean station"></textarea></div><div><label>PAY TYPE</label><select id="popPayType"><option value="hourly">Salary per hour</option><option value="biweekly">Salary per 2 weeks</option><option value="monthly">Salary per month</option></select></div><div><label>PAY AMOUNT ($)</label><input id="popPay" type="number" min="0" step="0.01" placeholder="0.00"></div><div><label id="popStartLabel">START</label><input id="popStart" type="time"></div><div><label id="popEndLabel">END</label><input id="popEnd" type="time"></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="popSave">Save changes</button><button class="btn" id="popRemove">Remove this day's shift</button><button class="btn" id="popCancel">Cancel</button></div></div></div></main>
<script>
const D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],KEY="tulan_schedule_v2";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{version:2,employees:[],schedule:Object.fromEntries(D.map(d=>[d,[]]))};
let day="Mon",viewMode="Day";state.notes=Array.isArray(state.notes)?state.notes:[];
function isoToday(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function activeNotesAt(date,time){return (state.notes||[]).filter(n=>date>=n.startDate&&date<=n.endDate&&(n.allDay=="yes"||(!time||(time>=n.startTime&&time<n.endTime))))}

const $=x=>document.getElementById(x), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{let [h,m]=t.split(":").map(Number),a=h>=12?"PM":"AM";h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+" "+a};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function setView(v){viewMode=v;render()}
function setDay(d){day=d;render()}
function render(){
 $("views").innerHTML=["Day","Week","Month"].map(v=>`<button class="pill ${v==viewMode?"on":""}" data-v="${v}">${v}</button>`).join("");
 $("views").querySelectorAll("button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
 $("dayPanel").hidden=viewMode!="Day";$("weekPanel").hidden=viewMode!="Week";$("monthPanel").hidden=viewMode!="Month";
 $("days").innerHTML=D.map(d=>`<button class="pill ${d==day?"on":""}" data-d="${d}">${d}${(d=="Sat"||d=="Sun")?" • CLOSED":""}</button>`).join("");
 $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>setDay(b.dataset.d));
 let t=$("time").value||"16:00", rows=(state.schedule[day]||[]).filter(x=>t>=x.start&&t<x.end);
 let now=new Date(),target=D.indexOf(day),todayIdx=(now.getDay()+6)%7,delta=(target-todayIdx+7)%7,dd=new Date(now);dd.setDate(now.getDate()+delta);let selectedDate=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
 let abs=activeNotesAt(selectedDate,t),absNames=new Set(abs.map(n=>n.employee)),presentRows=rows.filter(x=>!absNames.has(x.name));
 $("count").textContent=presentRows.length;
 let hourLabor=presentRows.reduce((sum,x)=>{let e=state.employees.find(y=>y.name==x.name)||{};return e.payType==="hourly"?sum+Number(e.payAmount||0):sum},0);
 $("dayLaborLabel").textContent="LABOR COST AT "+fmt(t);
 $("dayLabor").textContent="$"+hourLabor.toFixed(2);
 $("absenceBanner").innerHTML=abs.length?`<div class="card" style="margin-bottom:12px"><b>Time off / absent for ${selectedDate}</b>${abs.map(n=>`<div class="muted">${esc(n.employee)} — ${esc(n.type)}${n.allDay=="yes"?" (all day)":" "+fmt(n.startTime)+"–"+fmt(n.endTime)}</div>`).join("")}</div>`:"";$("staff").innerHTML=(presentRows.length||rows.some(x=>absNames.has(x.name)))?rows.map(x=>{let a=abs.find(n=>n.employee==x.name);return `<button type="button" class="person" data-person="${esc(x.name)}" style="width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #ddd;padding:14px 0;display:flex;justify-content:space-between;align-items:center;${a?"opacity:.55":""}"><div><div class="name">${esc(x.name)}${a?" — ABSENT":""}</div><div class="muted">${a?esc(a.type)+(a.note?" • "+esc(a.note):""):esc(x.role)}</div></div><b>${a?"OUT":fmt(x.start)+"–"+fmt(x.end)}</b></button>`}).join(""):'<span class="muted">No employees scheduled at this time.</span>';
 $("staff").querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>openEmployeePopup(b.dataset.person));
 let wt=$("weekTime").value||"14:00", weekdays=D.slice(0,5); $("week").innerHTML="<table><thead><tr><th>"+fmt(wt)+"</th>"+weekdays.map(d=>`<th>${d}</th>`).join("")+"</tr></thead><tbody><tr><th>Employees working</th>"+weekdays.map(d=>{let working=(state.schedule[d]||[]).filter(x=>wt>=x.start&&wt<x.end);let dayShifts=(state.schedule[d]||[]);let labor=dayShifts.reduce((sum,x)=>{let e=state.employees.find(y=>y.name==x.name)||{};if(e.payType!=="hourly")return sum;let [sh,sm]=x.start.split(":").map(Number),[eh,em]=x.end.split(":").map(Number);let hours=((eh*60+em)-(sh*60+sm))/60;if(hours<0)hours+=24;return sum+hours*Number(e.payAmount||0)},0);let [wh,wm]=wt.split(":").map(Number),cutoff=wh*60+wm;let laborToHour=dayShifts.reduce((sum,x)=>{let e=state.employees.find(y=>y.name==x.name)||{};if(e.payType!=="hourly")return sum;let [sh,sm]=x.start.split(":").map(Number),[eh,em]=x.end.split(":").map(Number),start=sh*60+sm,end=eh*60+em;if(end<start)end+=1440;let c=cutoff;if(c<start&&end>1440)c+=1440;let mins=Math.max(0,Math.min(c,end)-start);return sum+(mins/60)*Number(e.payAmount||0)},0);return `<td>${working.length?working.map(x=>`<div style=\"margin-bottom:8px\"><b>${esc(x.name)}</b><div class=\"muted\">${esc(x.role)}</div></div>`).join(""):`<span class=\"muted\">None</span>`}<div style=\"margin-top:10px;font-weight:800\">Staff working at ${fmt(wt)}: ${working.length}</div><div style=\"margin-top:6px;font-weight:800\">Total staff today: ${dayShifts.length}</div><div style=\"margin-top:6px;font-weight:800;color:var(--p)\">Total labor cost for ${d}: $${labor.toFixed(2)}</div></td>`}).join("")+"</tr></tbody></table>";
 renderCalendar(); renderEditor();
}
function openEmployeePopup(name){let e=state.employees.find(x=>x.name==name);if(!e)return;let s=(state.schedule[day]||[]).find(x=>x.name==name);$("popName").value=e.name||"";$("popRole").value=e.role||"";$("popDuties").value=e.duties||"";$("popPayType").value=e.payType||"hourly";$("popPay").value=e.payAmount??"";$("popStart").value=s?s.start:"";$("popEnd").value=s?s.end:"";$("popStartLabel").textContent=day+" START";$("popEndLabel").textContent=day+" END";$("employeeModal").dataset.oldName=name;$("employeeModal").hidden=false}function closeEmployeePopup(){$("employeeModal").hidden=true}
function renderEditor(){
 let rows=state.schedule[day]||[];
 let names=state.employees.map(e=>e.name);
 let selected=(window.editEmployeeName&&names.includes(window.editEmployeeName))?window.editEmployeeName:(names[0]||"");
 window.editEmployeeName=selected;
 let selector=`<div style="margin:12px 0"><label>SELECT EMPLOYEE</label><select id="employeeSelect"><option value="">Choose employee…</option>${state.employees.map(e=>`<option value="${esc(e.name)}" ${e.name==selected?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>`;
 let e=state.employees.find(x=>x.name==selected);
 let s=rows.find(x=>x.name==selected);
 let form=e?`<div class="edit"><div class="grid"><div><label>NAME</label><input id="mn" value="${esc(e.name)}"></div><div><label>POSITION</label><input id="mr" value="${esc(e.role)}"></div><div><label>${day} START</label><input id="ms" type="time" value="${s?s.start:""}"></div><div><label>${day} END</label><input id="me" type="time" value="${s?s.end:""}"></div></div><div class="actions" style="margin-top:8px"><button class="primary" id="saveSelected">Save changes</button><button class="btn" id="removeShift">${s?"Remove "+day+" shift":"No "+day+" shift"}</button></div></div>`:'<div class="muted">Select an employee to modify.</div>';
 $("editor").innerHTML=selector+form;
 let sel=$("employeeSelect");if(sel)sel.onchange=()=>{window.editEmployeeName=sel.value;renderEditor()};
 if(e){
   $("saveSelected").onclick=()=>{
     let old=e.name,n=$("mn").value.trim(),r=$("mr").value.trim(),st=$("ms").value,en=$("me").value;
     if(!n)return alert("Enter a name");
     state.employees.forEach(x=>{if(x.name==old){x.name=n;x.role=r}});
     D.forEach(d=>(state.schedule[d]||[]).forEach(x=>{if(x.name==old){x.name=n;x.role=r}}));
     let idx=(state.schedule[day]||[]).findIndex(x=>x.name==n);
     if(st&&en){if(idx>=0){state.schedule[day][idx].start=st;state.schedule[day][idx].end=en}else state.schedule[day].push({name:n,role:r,start:st,end:en})}
     window.editEmployeeName=n;save();render();alert("Employee updated");
   };
   $("removeShift").onclick=()=>{
     let idx=(state.schedule[day]||[]).findIndex(x=>x.name==e.name);
     if(idx<0)return;
     if(confirm("Remove "+e.name+"'s "+day+" shift?")){state.schedule[day].splice(idx,1);save();render()}
   };
 }
}
function edit(i){let old=state.schedule[day][i].name,n=$("n"+i).value.trim(),r=$("r"+i).value.trim();if(!n)return alert("Enter a name");state.schedule[day][i]={name:n,role:r,start:$("s"+i).value,end:$("e"+i).value};let e=state.employees.find(x=>x.name==old);if(e){e.name=n;e.role=r} D.forEach(d=>(state.schedule[d]||[]).forEach(x=>{if(x.name==old){x.name=n;x.role=r}}));save();render()}
function del(i){if(confirm("Remove this employee from "+day+"?")){state.schedule[day].splice(i,1);save();render()}}
function renderNotes(){let list=state.notes||[];$("noteList").innerHTML=list.length?"<b>Saved notes</b>"+list.map((n,i)=>`<div class="person"><div><div class="name">${esc(n.employee)} — ${esc(n.type)}</div><div class="muted">${n.startDate} to ${n.endDate}${n.note?" • "+esc(n.note):""}</div></div><button class="btn" data-note-del="${i}">Delete</button></div>`).join(""):'<span class="muted">No saved time-off notes.</span>';document.querySelectorAll("[data-note-del]").forEach(b=>b.onclick=()=>{state.notes.splice(+b.dataset.noteDel,1);save();renderNotes();render()})}
$("notesBtn").onclick=()=>{$("noteEmployee").innerHTML=state.employees.map(e=>`<option>${esc(e.name)}</option>`).join("");let d=isoToday();$("noteStartDate").value=d;$("noteEndDate").value=d;renderNotes();$("noteModal").hidden=false};
$("noteCancel").onclick=()=>{$("noteModal").hidden=true};
$("noteModal").onclick=e=>{if(e.target===$("noteModal"))$("noteModal").hidden=true};
$("noteSave").onclick=()=>{let n={employee:$("noteEmployee").value,type:$("noteType").value,startDate:$("noteStartDate").value,endDate:$("noteEndDate").value,allDay:$("noteAllDay").value,startTime:$("noteStartTime").value,endTime:$("noteEndTime").value,note:$("noteText").value.trim()};if(!n.employee||!n.startDate||!n.endDate)return alert("Choose employee and dates.");if(n.allDay=="no"&&(!n.startTime||!n.endTime))return alert("Enter start and end time.");state.notes.push(n);save();renderNotes();render();alert("Time-off note saved.")};
$("popCancel").onclick=closeEmployeePopup;$("employeeModal").onclick=e=>{if(e.target===$("employeeModal"))closeEmployeePopup()};$("popSave").onclick=()=>{let old=$("employeeModal").dataset.oldName,n=$("popName").value.trim(),r=$("popRole").value.trim();if(!n)return alert("Enter a name");let duties=$("popDuties").value.trim(),payType=$("popPayType").value,payAmount=$("popPay").value;let e=state.employees.find(x=>x.name==old);if(e){e.name=n;e.role=r;e.duties=duties;e.payType=payType;e.payAmount=payAmount}D.forEach(d=>(state.schedule[d]||[]).forEach(x=>{if(x.name==old){x.name=n;x.role=r}}));let st=$("popStart").value,en=$("popEnd").value,idx=(state.schedule[day]||[]).findIndex(x=>x.name==n);if(st&&en){if(idx>=0){state.schedule[day][idx].start=st;state.schedule[day][idx].end=en;state.schedule[day][idx].role=r}else state.schedule[day].push({name:n,role:r,start:st,end:en})}save();closeEmployeePopup();render();alert("Employee updated")};$("popRemove").onclick=()=>{let old=$("employeeModal").dataset.oldName,idx=(state.schedule[day]||[]).findIndex(x=>x.name==old);if(idx<0)return alert("No shift scheduled for "+day);if(confirm("Remove "+old+"'s "+day+" shift?")){state.schedule[day].splice(idx,1);save();closeEmployeePopup();render()}};
$("manageBtn").onclick=()=>{let p=$("managePanel");p.hidden=!p.hidden;$("manageBtn").textContent=p.hidden?"Modify employees":"Hide employee editor";if(!p.hidden)p.scrollIntoView({behavior:"smooth",block:"start"})};
$("add").onclick=()=>{let n=prompt("Employee name");if(!n)return;let r=prompt("Position","Staff")||"Staff";if(!state.employees.some(x=>x.name==n))state.employees.push({name:n,role:r});state.schedule[day].push({name:n,role:r,start:"09:00",end:"17:00"});save();render()};
$("copy").onclick=()=>{if(day=="Sat"||day=="Sun")return alert("Saturday and Sunday are closed.");if(confirm("Copy "+day+" schedule to Monday through Friday?")){["Mon","Tue","Wed","Thu","Fri"].forEach(d=>state.schedule[d]=JSON.parse(JSON.stringify(state.schedule[day])));state.schedule.Sat=[];state.schedule.Sun=[];save();render()}};
$("clearDay").onclick=()=>{if(confirm("Remove every shift from "+day+"? Employee names will be kept.")){state.schedule[day]=[];save();render()}};
$("clearAll").onclick=()=>{if(confirm("Clear ALL schedules Monday through Sunday? Employee names will be kept.")){D.forEach(d=>state.schedule[d]=[]);save();render();alert("All schedules cleared. Employee names were kept.")}};
$("importBtn").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.schedule||!x.employees)throw 0;state=x;state.notes=Array.isArray(state.notes)?state.notes:[];state.schedule.Sat=[];state.schedule.Sun=[];save();render();alert("Imported successfully. Saturday and Sunday are closed.")}catch{alert("That backup file is not valid.")}};rd.readAsText(f)};
$("exportBtn").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="tulan-schedule-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function renderCalendar(){let v=$("monthPick").value;if(!v)return;let [y,m]=v.split("-").map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),offset=(first.getDay()+6)%7,html="";["M","T","W","T","F","S","S"].forEach(x=>html+=`<div class="muted" style="text-align:center"><b>${x}</b></div>`);for(let i=0;i<offset;i++)html+="<div></div>";for(let n=1;n<=last.getDate();n++){let dow=(new Date(y,m-1,n).getDay()+6)%7,d=D[dow],cnt=(state.schedule[d]||[]).length;html+=`<button class="cell" data-date="${n}" type="button"><b>${n}</b><span class="badge">${cnt} staff</span></button>`}$("calendar").innerHTML=html;$("calendar").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("monthInfo").textContent=v+"-"+String(b.dataset.date).padStart(2,"0")+" • "+D[(new Date(y,m-1,+b.dataset.date).getDay()+6)%7]})}
let now=new Date();$("monthPick").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");$("monthPick").onchange=renderCalendar;
for(let h=8;h<=23;h++){let v=String(h).padStart(2,"0")+":00";$("time").innerHTML+=`<option value="${v}" ${h==16?"selected":""}>${fmt(v)}</option>`;$("weekTime").innerHTML+=`<option value="${v}" ${h==14?"selected":""}>${fmt(v)}</option>`}$("time").onchange=render;$("weekTime").onchange=render;render();
</script></body></html>
